<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vagabond Labs</title>
    <style>
        /* --- STYLE ORIGINEL DE VAGABOND LABS --- */
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            background-color: #ffffff;
            color: #333333;
            line-height: 1.6;
        }
        .header-container {
            text-align: center;
            padding: 30px 20px 10px 20px;
        }
        h1 {
            margin: 0;
            font-size: 2.5em;
            letter-spacing: 1px;
        }
        .subtitle {
            color: #666;
            margin: 5px 0 15px 0;
            font-style: italic;
        }
        .logo-placeholder {
            margin-bottom: 10px;
            font-weight: bold;
            color: #555;
        }

        /* --- NOUVEAU MENU RESPONSIVE (MOBILE & PC) --- */
        nav {
            border-top: 1px solid #eee;
            border-bottom: 1px solid #eee;
            background: #fafafa;
            padding: 10px 0;
            position: sticky;
            top: 0;
            z-index: 1000;
        }
        .nav-links {
            list-style: none;
            padding: 0;
            margin: 0;
            display: flex;
            justify-content: center;
            gap: 25px;
        }
        .nav-links a {
            text-decoration: none;
            color: #333;
            font-weight: bold;
            font-size: 16px;
            padding: 8px 12px;
            transition: color 0.2s;
        }
        .nav-links a:hover, .nav-links a.active {
            color: #0076ff; /* Couleur d'accentuation sobre */
        }

        /* --- CONTENU --- */
        .container {
            max-width: 800px;
            margin: auto;
            padding: 20px;
        }
        section {
            margin-bottom: 40px;
        }
        h2 {
            border-bottom: 2px solid #333;
            padding-bottom: 5px;
            margin-top: 30px;
        }

        /* Ajustement Mobile pour le menu */
        @media (max-width: 480px) {
            .nav-links {
                gap: 10px;
            }
            .nav-links a {
                font-size: 14px;
                padding: 6px 8px;
            }
        }
    </style>
</head>
<body>

<!-- EN-TÊTE D'ORIGINE -->
<div class="header-container">
    <div class="logo-placeholder">[ Logo Vagabond Labs ]</div>
    <h1>Vagabond Labs</h1>
    <p class="subtitle">Entreprise de bureau d'étude en électronique</p>
</div>

<!-- LE MENU DEMANDÉ -->
<nav>
    <ul class="nav-links">
        <li><a href="#accueil" class="active">Accueil</a></li>
        <li><a href="#eshop">E-Shop</a></li>
        <li><a href="#apropos">À propos</a></li>
        <li><a href="#brevets">Brevets</a></li>
    </ul>
</nav>

<!-- SECTIONS DU SITE -->
<div class="container">

    <section id="accueil">
        <h2>Bienvenue</h2>
        <p>Notre entreprise fondée en 2026 prototype et industrialise des solutions techniques en électronique.</p>
        <p>Notre objectif principal : Concrétiser nos rêves.</p>
    </section>

    <!-- Les autres sections (E-Shop, A propos, Brevets) seront construites ici tranquillement -->

</div>

</body>
</html>
