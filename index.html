<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vagabond Labs - Boutique</title>
    <style>
        /* --- STYLE GENERAL & MOBILE-FIRST --- */
        :root {
            --primary: #25d366; /* Vert WhatsApp */
            --dark: #1a1a1a;
            --light: #f4f4f4;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            margin: 0;
            padding: 0;
            background-color: var(--light);
            color: var(--dark);
        }
        header {
            background: var(--dark);
            color: white;
            padding: 15px;
            text-align: center;
            sticky: top;
            position: sticky;
            top: 0;
            z-index: 100;
        }
        .container {
            padding: 15px;
            max-width: 800px;
            margin: auto;
        }

        /* --- GRILLE DE PRODUITS --- */
        .products-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 20px;
            margin-bottom: 40px;
        }
        .product-card {
            background: white;
            border-radius: 12px;
            padding: 15px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.05);
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }
        .product-card h3 { margin: 10px 0 5px 0; }
        .product-price { font-weight: bold; color: #e43f5a; margin-bottom: 15px; }

        /* --- FORMULAIRES & BOUTONS MOBILE --- */
        select, input {
            width: 100%;
            padding: 10px;
            margin-bottom: 10px;
            border: 1px solid #ccc;
            border-radius: 8px;
            box-sizing: border-box;
            font-size: 16px; /* Évite le zoom automatique sur iPhone */
        }
        button {
            width: 100%;
            background: var(--dark);
            color: white;
            border: none;
            padding: 12px;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.2s;
        }
        button:active { transform: scale(0.98); }

        /* --- BARRE DE PANIER FLOTTANTE (MOBILE) --- */
        .cart-bar {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            background: white;
            box-shadow: 0 -4px 10px rgba(0,0,0,0.1);
            padding: 15px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-top-left-radius: 15px;
            border-top-right-radius: 15px;
        }
        .btn-whatsapp {
            background: var(--primary);
            color: white;
            width: auto;
            padding: 10px 20px;
        }
    </style>
</head>
<body>

<header>
    <h2>Vagabond Labs 🚀</h2>
    <p>Prototype & Industrialisation</p>
</header>

<div class="container">
    <h2>Notre Catalogue</h2>

    <div class="products-grid">
        <!-- PRODUIT 1: STANDARD -->
        <div class="product-card">
            <div>
                <h3>Clavier Personnalisé</h3>
                <p>Entièrement produit par nos soins, optimisé et sur-mesure.</p>
            </div>
            <div>
                <div class="product-price">149,00 €</div>
                <button onclick="ajouterAuPanier('Clavier Custom', 149)">Ajouter au panier</button>
            </div>
        </div>

        <!-- PRODUIT 2: SUR MESURE (IMPRESSION 3D) -->
        <div class="product-card">
            <div>
                <h3>Impression 3D Sur-Mesure</h3>
                <p>Tarif indicatif : 1€ les 15g (PLA, ASA, PETG).</p>

                <label for="material">Matériau :</label>
                <select id="material">
                    <option value="PLA">PLA</option>
                    <option value="ASA">ASA</option>
                    <option value="PETG">PETG</option>
                </select>

                <label for="weight">Poids estimé (en grammes) :</label>
                <input type="number" id="weight" value="30" min="10">
            </div>
            <div>
                <button onclick="ajouterImpression3D()">Ajouter l'impression</button>
            </div>
        </div>
    </div>
</div>

<!-- BARRE DE PANIER FLOTTANTE -->
<div class="cart-bar">
    <div>
        <strong>Panier : <span id="cart-count">0</span> article(s)</strong>
        <div id="cart-total" style="font-size: 14px; color: #555;">Total : 0,00 €</div>
    </div>
    <button class="btn-whatsapp" onclick="envoyerCommande()">📱 Commander (WhatsApp)</button>
</div>

<script>
    // --- LOGIQUE DU PANIER ---
    let panier = [];

    function ajouterAuPanier(nom, prix) {
        panier.push({ nom: nom, prix: prix, details: "Produit standard" });
        mettreAJourInterface();
    }

    function ajouterImpression3D() {
        const mat = document.getElementById('material').value;
        const poids = document.getElementById('weight').value;
        // Calcul du prix estimé (1€ par tranche de 15g par exemple)
        const prixEstime = Math.round((poids / 15) * 100) / 100;

        panier.push({
            nom: `Impression 3D (${mat})`,
            prix: prixEstime,
            details: `Poids: ${poids}g`
        });
        mettreAJourInterface();
    }

    function mettreAJourInterface() {
        document.getElementById('cart-count').innerText = panier.length;
        let total = panier.reduce((sum, item) => sum + item.prix, 0);
        document.getElementById('cart-total').innerText = `Total approx : ${total.toFixed(2)} €`;
    }

    function envoyerCommande() {
        if(panier.length === 0) {
            alert("Votre panier est vide !");
            return;
        }

        let numeroTelephone = "33612345678"; // ⚠️ REMPLACEZ PAR VOTRE NUMÉRO (Format international sans le +)
        let texte = "Bonjour Vagabond Labs ! Je souhaite commander :\n\n";

        panier.forEach((item, index) => {
            texte += `${index + 1}. ${item.nom} - ${item.details} (${item.prix.toFixed(2)}€)\n`;
        });

        let total = panier.reduce((sum, item) => sum + item.prix, 0);
        texte += `\n*Total estimé : ${total.toFixed(2)}€*`;

        // Encodage du texte pour l'URL WhatsApp
        let urlWhatsApp = `https://wa.me{numeroTelephone}?text=${encodeURIComponent(texte)}`;

        // Ouvre WhatsApp avec le message prêt
        window.open(urlWhatsApp, '_blank');
    }
</script>

</body>
</html>
